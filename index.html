<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Brief</title>
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d5c86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Brief">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one calm reading column, sections separated by hairlines, numbers in mono. */
  --bg: #f6f7f8;
  --surface: #ffffff;
  --ink: #16191d;
  --muted: #5d6670;
  --line: #e2e5e9;
  --accent: #1d5c86;
  --up: #1a7f4b;
  --down: #b3362f;
  --font-display: "Instrument Serif", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111417; --surface: #181c20; --ink: #e8eaed; --muted: #98a1ab;
    --line: #2a3036; --accent: #7db6dc; --up: #4cc38a; --down: #f0776e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111417; --surface: #181c20; --ink: #e8eaed; --muted: #98a1ab;
  --line: #2a3036; --accent: #7db6dc; --up: #4cc38a; --down: #f0776e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; display: grid; gap: 40px; }
header.top { display: grid; gap: 10px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.top-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand-wrap { display: flex; align-items: center; gap: 10px; }
.logo { width: 32px; height: 32px; flex: none; }
.brand { font: 400 15px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 400 clamp(34px, 6vw, 48px)/1.1 var(--font-display); margin: 0; text-wrap: balance; }
.meta { color: var(--muted); font-size: 14px; }
select {
  font: 500 14px var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer;
}
select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { display: grid; gap: 44px; }
section { display: grid; gap: 16px; }
h2 {
  font: 700 17px/1 var(--font-mono); letter-spacing: .09em; text-transform: uppercase;
  color: var(--accent); margin: 0; display: flex; align-items: center; gap: 12px;
}
h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.summary { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.summary li { font-size: 18px; line-height: 1.55; padding-left: 18px; position: relative; max-width: 65ch; }
.summary li::before { content: ""; position: absolute; left: 0; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tile { background: var(--surface); padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.tile .label { font-size: 13px; color: var(--muted); font-weight: 500; }
.tile .value { font: 500 20px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.tile .chg { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.tile .note { font-size: 12px; color: var(--muted); line-height: 1.4; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.stories { display: grid; gap: 22px; }
.story { display: grid; gap: 6px; max-width: 65ch; }
.story h3 { font: 600 17px/1.35 var(--font-body); margin: 0; text-wrap: balance; }
.story p { margin: 0; color: var(--ink); }
.why { font-size: 14.5px; color: var(--muted); border-left: 2px solid var(--accent); padding-left: 10px; }
.why b { color: var(--ink); font-weight: 600; }
.src { font-size: 13px; color: var(--muted); }
.src a { color: var(--accent); text-decoration: none; }
.src a:hover { text-decoration: underline; }
.weather { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.wday { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 6px; text-align: center; display: grid; gap: 4px; }
.wday .d { font-size: 13px; font-weight: 600; }
.wday .t { font: 500 15px var(--font-mono); font-variant-numeric: tabular-nums; }
.wday .t span { color: var(--muted); }
.wday .r { font: 400 12px var(--font-mono); color: var(--muted); }
.wday.wet { border-color: var(--accent); }
.wday.wet .r { color: var(--accent); font-weight: 500; }
.wnote { margin: 0; color: var(--muted); font-size: 14.5px; }
.watch { display: grid; gap: 0; border-top: 1px solid var(--line); }
.watch-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.watch-row .n { font-weight: 600; }
.watch-row .v { font: 500 15px var(--font-mono); text-align: right; }
.watch-row .wn { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: grid; gap: 8px; }
.term .word { font: 400 30px/1.15 var(--font-display); }
.term p { margin: 0; max-width: 65ch; }
.term .ex { font-size: 14.5px; color: var(--muted); }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }
.state { color: var(--muted); padding: 40px 0; }
@media (max-width: 520px) {
  .wrap { padding: 24px 16px 48px; gap: 32px; }
  .weather { grid-template-columns: repeat(3, 1fr); }
  .summary li { font-size: 17px; }
}
@media (prefers-reduced-motion: no-preference) {
  main { animation: fade .35s ease-out; }
  @keyframes fade { from { opacity: .4; } to { opacity: 1; } }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <span class="brand-wrap"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M8 9.5h13a1.5 1.5 0 0 1 1.5 1.5v11.5a1.5 1.5 0 0 0 1.5 1.5H10a2 2 0 0 1-2-2z" fill="var(--surface)"/><path d="M22.5 13H25v9.5a1.25 1.25 0 0 1-2.5 0z" fill="var(--surface)" opacity=".7"/><rect x="10.5" y="12" width="9.5" height="3" rx=".75" fill="var(--accent)"/><rect x="10.5" y="17" width="4" height="4.5" rx=".6" fill="var(--accent)" opacity=".45"/><rect x="16" y="17" width="4" height="1.2" rx=".6" fill="var(--accent)" opacity=".6"/><rect x="16" y="19.2" width="4" height="1.2" rx=".6" fill="var(--accent)" opacity=".6"/><rect x="10.5" y="22.3" width="9.5" height="1.2" rx=".6" fill="var(--accent)" opacity=".6"/></svg><span class="brand">Daily Brief</span></span>
      <label for="edition-picker" class="meta">Past briefs
        <select id="edition-picker" aria-label="Choose a past brief"></select>
      </label>
    </div>
    <h1 id="edition">Loading today's brief…</h1>
    <div class="meta" id="updated"></div>
  </header>
  <main id="main"><p class="state">Fetching the latest edition.</p></main>
  <footer>Updated every morning with markets, politics, the economy, marketing and Auckland weather. Figures are from the sources linked under each story. Not financial advice.</footer>
</div>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-NZ", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  let index = null;

  function story(s) {
    const src = s.source && s.source.url
      ? `<div class="src">Source: <a href="${esc(s.source.url)}" target="_blank" rel="noopener">${esc(s.source.name)}</a></div>` : "";
    return `<article class="story"><h3>${esc(s.headline)}</h3><p>${esc(s.summary)}</p>` +
      (s.why ? `<div class="why"><b>Why it matters:</b> ${esc(s.why)}</div>` : "") + src + `</article>`;
  }
  function chg(p) {
    if (p === null || p === undefined) return "";
    const cls = p > 0 ? "up" : p < 0 ? "down" : "flat";
    const sign = p > 0 ? "▲ +" : p < 0 ? "▼ " : "";
    return `<span class="chg ${cls}">${sign}${Number(p).toFixed(2)}%</span>`;
  }
  function section(title, inner) { return inner ? `<section><h2>${esc(title)}</h2>${inner}</section>` : ""; }
  function stories(list) { return list && list.length ? `<div class="stories">${list.map(story).join("")}</div>` : ""; }

  function render(b) {
    $("#edition").textContent = b.edition || fmtDate(b.date);
    $("#updated").textContent = b.updated ? `Updated ${b.updated}` : "";
    document.title = `Daily Brief · ${fmtDate(b.date)}`;
    let h = "";
    if (b.summary && b.summary.length) h += section("The day in 30 seconds", `<ul class="summary">${b.summary.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`);
    if (b.markets) {
      const tiles = (b.markets.indices || []).map((i) =>
        `<div class="tile"><span class="label">${esc(i.name)}</span><span class="value">${i.value ? esc(i.value) : "—"}</span>${chg(i.change_pct)}<span class="note">${esc(i.note)}</span></div>`).join("");
      h += section("Markets", (tiles ? `<div class="tiles">${tiles}</div>` : "") + stories(b.markets.stories));
    }
    h += section("NZ politics", stories(b.nz_politics));
    h += section("World", stories(b.world));
    if (b.economy) {
      const st = (b.economy.stats || []).map((s) =>
        `<div class="tile"><span class="label">${esc(s.label)}</span><span class="value">${esc(s.value)}</span><span class="note">${esc(s.note)}</span></div>`).join("");
      h += section("Economy & your wallet", (st ? `<div class="tiles">${st}</div>` : "") + stories(b.economy.stories));
    }
    h += section("Marketing & brands", stories(b.marketing));
    if (b.weather && b.weather.days) {
      const days = b.weather.days.map((d) =>
        `<div class="wday${d.rain >= 50 ? " wet" : ""}"><span class="d">${esc(d.day)}</span><span class="t">${esc(d.high)}°<span> / ${esc(d.low)}°</span></span><span class="r">${esc(d.rain)}% rain</span></div>`).join("");
      h += section(`${b.weather.location || "Auckland"} weather`, `<div class="weather">${days}</div>` + (b.weather.note ? `<p class="wnote">${esc(b.weather.note)}</p>` : ""));
    }
    if (b.watchlist && b.watchlist.length) {
      const rows = b.watchlist.map((w) => {
        const arrow = w.direction === "up" ? "▲ " : w.direction === "down" ? "▼ " : "";
        return `<div class="watch-row"><span class="n">${esc(w.name)}</span><span class="v ${esc(w.direction || "flat")}">${arrow}${esc(w.value)}</span><span class="wn">${esc(w.note)}</span></div>`;
      }).join("");
      h += section("Watchlist", `<div class="watch">${rows}</div>`);
    }
    if (b.term) {
      h += section("Term of the day", `<div class="term"><span class="word">${esc(b.term.term)}</span><p>${esc(b.term.definition)}</p>${b.term.example ? `<p class="ex">${esc(b.term.example)}</p>` : ""}</div>`);
    }
    $("#main").innerHTML = h;
  }

  async function load(date) {
    try {
      const r = await fetch(`data/briefs/${date}.json`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
      $("#edition-picker").value = date;
    } catch (e) {
      $("#main").innerHTML = `<p class="state">Couldn't load the brief for ${esc(date)}. Try refreshing, or pick another day from Past briefs.</p>`;
    }
  }

  function fromHash() {
    const h = location.hash.replace("#", "");
    return index && index.dates.includes(h) ? h : index.latest;
  }

  async function init() {
    try {
      const r = await fetch("data/index.json", { cache: "no-store" });
      index = await r.json();
    } catch (e) {
      $("#edition").textContent = "Brief unavailable";
      $("#main").innerHTML = `<p class="state">Couldn't reach the brief archive. Refresh the page to try again.</p>`;
      return;
    }
    const dates = [...index.dates].sort().reverse();
    $("#edition-picker").innerHTML = dates.map((d) => `<option value="${esc(d)}">${esc(fmtDate(d))}${d === index.latest ? " (latest)" : ""}</option>`).join("");
    $("#edition-picker").addEventListener("change", (e) => {
      const d = e.target.value;
      if (d === index.latest) { try { history.replaceState(null, "", location.pathname); } catch (_) {} load(d); }
      else location.hash = d;
    });
    window.addEventListener("hashchange", () => load(fromHash()));
    load(fromHash());
  }
  init();
})();
</script>
</body>
</html>
